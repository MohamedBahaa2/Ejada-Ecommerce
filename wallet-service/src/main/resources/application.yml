spring:
  application:
    name: wallet-service

  datasource:
    url: jdbc:mysql://localhost:3306/wallet_db?sslMode=DISABLED&allowPublicKeyRetrieval=true
    username: wallet_user
    password: wallet_pass

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
